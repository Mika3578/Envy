<link rel="stylesheet" type="text/css" href="downloads-modern.css" media="screen">
<!-- Modern Downloads Page -->
<div class="content-area">
    <h1 class="page-title">Downloads</h1>

    <!-- Controls Bar -->
    <div class="section">
        <div class="controls-bar">
            <div class="controls-left">
                <button type="button" class="btn btn-secondary" data-action="refresh-page">
                    <span class="icon">🔄</span> Refresh
                </button>
                <button type="button" class="btn btn-primary" data-action="select-all">
                    Select All
                </button>
                <button type="button" class="btn btn-danger" data-action="clear-selected" disabled>
                    Clear Selected
                </button>
            </div>
            <div class="controls-right">
                <form class="filter-form" method="get" data-ajax>
                    <input type="hidden" name="filter_set" value="1" />
                    <input type="hidden" name="csrf_token" value="<%= csrf_token %>" />
                    <div class="filter-group">
                        <label for="filter-status">Status:</label>
                        <select id="filter-status" name="filter_status" class="form-control">
                            <option value="">All</option>
                            <option value="active">Active</option>
                            <option value="paused">Paused</option>
                            <option value="completed">Completed</option>
                            <option value="error">Error</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-search">Search:</label>
                        <input type="text" id="filter-search" name="filter_search" class="form-control" placeholder="Filename...">
                    </div>
                    <button type="submit" class="btn btn-secondary">Filter</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Downloads Table -->
    <div class="section">
        <div class="table-container">
            <table class="table table-sortable" id="downloads-table">
                <thead>
                    <tr>
                        <th><label class="sr-only" for="select-all">Select all downloads</label><input type="checkbox" id="select-all"></th>
                        <th data-sort="filename">Filename</th>
                        <th data-sort="size">Size</th>
                        <th data-sort="progress">Progress</th>
                        <th data-sort="speed">Speed</th>
                        <th data-sort="sources">Sources</th>
                        <th data-sort="status">Status</th>
                        <th data-sort="priority">Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic content will be loaded here -->
                    <tr class="loading-row">
                        <td colspan="9" class="text-center">
                            <div class="loading"></div>
                            Loading downloads...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bulk Actions -->
    <div class="section">
        <h3>Bulk Actions</h3>
        <div class="bulk-actions">
            <button type="button" class="btn btn-success" data-action="start-selected" disabled>
                Start Selected
            </button>
            <button type="button" class="btn btn-warning" data-action="pause-selected" disabled>
                Pause Selected
            </button>
            <button type="button" class="btn btn-danger" data-action="cancel-selected" disabled>
                Cancel Selected
            </button>
            <button type="button" class="btn btn-secondary" data-action="move-selected" disabled>
                Change Priority
            </button>
        </div>
    </div>

    <!-- Statistics -->
    <div class="section">
        <h3>Download Statistics</h3>
        <div class="grid grid-3">
            <div class="stat-card">
                <div class="stat-value" data-stat="total_downloads">0</div>
                <div class="stat-label">Total Downloads</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" data-stat="active_downloads">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" data-stat="completed_downloads">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
    </div>
</div>
<script src="downloads-modern.js"></script>
