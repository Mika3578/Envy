body:
  - type: markdown
    attributes:
      value: |
        Polls are for **non-binding** community preference checks. Results do not override the roadmap in
        [docs/DEVELOPMENT_PLAN.md](https://github.com/Mika3578/Envy/blob/develop/docs/DEVELOPMENT_PLAN.md).
  - type: input
    id: question
    attributes:
      label: Poll question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why ask now? Link related Issues/Discussions if any.
    validations:
      required: true
