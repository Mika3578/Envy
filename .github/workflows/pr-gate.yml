name: PR Gate

# Waits for classified CI checks for this PR. Does NOT approve, does NOT merge,
# and does NOT replace Protect develop review requirements (≥1 APPROVED,
# dismiss-stale on push, thread resolution; last-push approval is off).
# Always requires Analyze (c-cpp|javascript-typescript|csharp) and Format Check.
# Stricter than GitHub: must_pass rejects skipped/neutral.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify (gate)
    uses: ./.github/workflows/classify-changes.yml

  gate:
    name: PR Gate
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Fail if classification failed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change classification did not succeed (${{ needs.changes.result }})."
          exit 1

      - name: Wait for expected PR checks
        if: needs.changes.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_WINDOWS_BUILD: ${{ needs.changes.outputs.run_windows_build }}
          RUN_REMOTE_JS: ${{ needs.changes.outputs.run_remote_js }}
          RUN_DEP_REVIEW: ${{ needs.changes.outputs.run_dep_review }}
          TIMEOUT_SEC: "3000"
          # Keep script default POLL_SEC=15 (pr-gate.sh). A 10s override was
          # considered for ≤5s earlier detection, but each poll queries both
          # HEAD and merge SHAs; at long timeouts two concurrent Gate jobs
          # can stress the Actions API quota. See docs/10_dev/CI_AUDIT_2026-09.md.
        run: bash .github/scripts/pr-gate.sh
