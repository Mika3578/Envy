name: CodeQL C# Manual Build

# C# analysis uses Windows and is deferred until live-test/Ready on develop.
# Full phases always publish the configuration expected by Code Scanning.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: codeql-csharp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  phase:
    uses: ./.github/workflows/pr-phase.yml

  analyze-csharp:
    name: Analyze (csharp)
    needs: phase
    if: always()
    runs-on: ${{ needs.phase.outputs.full_validation == 'true' && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Fail if phase selection failed
        if: needs.phase.result != 'success'
        run: exit 1

      - name: C# analysis deferred during Draft stabilization
        if: needs.phase.outputs.phase == 'draft'
        run: |
          echo '::notice::DEFERRED: no C# Windows build or CodeQL analysis ran.'
          echo 'C# analysis is DEFERRED until live-test/Ready. No SARIF validation is certified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: needs.phase.outputs.full_validation == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        if: needs.phase.outputs.full_validation == 'true'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        with:
          msbuild-architecture: x64

      - name: Initialize CodeQL (manual C# build)
        if: needs.phase.outputs.full_validation == 'true'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          languages: csharp
          build-mode: manual
          # security-and-quality already includes security-extended + default.
          queries: security-and-quality

      - name: Build SkinUpdater solution (Release, Any CPU)
        if: needs.phase.outputs.full_validation == 'true'
        shell: cmd
        run: |
          msbuild "Languages\Tools\SkinUpdater\SkinUpdater.sln" ^
            /m ^
            /nologo ^
            /verbosity:minimal ^
            /p:Configuration=Release ^
            /p:Platform="Any CPU"

      - name: Perform CodeQL Analysis
        if: needs.phase.outputs.full_validation == 'true'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          category: /language:csharp
