name: Format check

# Differential formatting on pull requests lives in code-quality.yml
# (`Format Check`, required context). This workflow remains for manual runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: clang-format --dry-run on first-party trees
        shell: bash
        run: |
          files=$(git ls-files 'Envy/*.cpp' 'Envy/*.h' 'TorrentEnvy/*.cpp' 'TorrentEnvy/*.h' 'HashLib/*.cpp' 'HashLib/*.h')
          fail=0
          for f in $files; do
            [ -f "$f" ] || continue
            if ! clang-format --dry-run --Werror "$f" 2>&1; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::warning::Formatting differences detected. Run clang-format locally."
          fi
