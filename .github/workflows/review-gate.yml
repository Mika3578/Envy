# Advisory PR Review Gate: HEAD-scoped review completeness and merge-approval diagnostics.
# Not a Protect develop required check. Read-only; never approves, merges, or resolves threads.
name: PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to diagnose
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: pr-review-gate-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose HEAD review state
    if: >
      (
        github.event_name == 'workflow_dispatch'
      ) || (
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/acquire-pr-review-snapshot.sh
            .github/scripts/evaluate-pr-review-gate.py
          sparse-checkout-cone-mode: false

      - name: Acquire snapshot and evaluate gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR_NUMBER" >&2
            exit 1
          fi
          bash .github/scripts/acquire-pr-review-snapshot.sh > snapshot.json
          python3 .github/scripts/evaluate-pr-review-gate.py --snapshot-json - < snapshot.json > gate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          gate = json.loads(Path("gate.json").read_text(encoding="utf-8"))
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write(gate["report"])
              handle.write("\n```json\n")
              handle.write(json.dumps(gate, indent=2))
              handle.write("\n```\n")
          print(gate["next_action"])
          PY
