# Manual final Copilot Code Review for eligible develop pull requests.
# Actions GITHUB_TOKEN can requestReviews; agent integrations often cannot (403).
# Does not run on push/synchronize — dispatch intentionally after Ready + green CI.

name: Request final Copilot review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (open, Ready, targeting develop)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-final-copilot-${{ github.event.inputs.pr_number }}
  # Do not cancel mid-run: clear/re-request must finish or human reviewers can be dropped.
  cancel-in-progress: false

jobs:
  request:
    name: Request final Copilot review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/request-final-copilot-review.sh
          sparse-checkout-cone-mode: false

      - name: Eligibility check and idempotent Copilot request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          MAX_COPILOT_GENERATIONS: "3"
        run: bash .github/scripts/request-final-copilot-review.sh
