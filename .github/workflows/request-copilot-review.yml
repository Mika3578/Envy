# Temporary: re-request Copilot code review for PR #294 only.
# Agent tokens cannot call requestReviewers (403); Actions GITHUB_TOKEN can.
# Safe after merge: the job is gated to pull_request.number == 294 (never runs again).
# Follow-up: delete this workflow once #294 has landed.

name: Request Copilot review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Request Copilot on #294
    if: >
      github.event.pull_request.number == 294 &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot review (GraphQL botIds)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NODE="$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){id}}}' -f o="$OWNER" -f n="$REPO" -F p="$PR_NUMBER" --jq '.data.repository.pullRequest.id')"
          BOT_NODE="$(gh api '/users/copilot-pull-request-reviewer%5Bbot%5D' --jq .node_id)"
          echo "PR node=$PR_NODE bot=$BOT_NODE"
          # Pass botIds as a GraphQL variable array via --input JSON.
          gh api graphql --input - <<EOF
          {
            "query": "mutation(\$pr:ID!,\$bots:[ID!]!){requestReviews(input:{pullRequestId:\$pr,botIds:\$bots,union:true}){clientMutationId}}",
            "variables": {
              "pr": "$PR_NODE",
              "bots": ["$BOT_NODE"]
            }
          }
          EOF
