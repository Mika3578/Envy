name: Dependabot auto-merge

# May enable GitHub squash auto-merge only. It must NEVER approve a PR and must
# NEVER call `gh pr merge` without `--auto`. Final merge is gated by the live
# Protect develop ruleset (required checks + ≥1 APPROVED review + thread
# resolution + dismiss-stale approvals). No Dependabot/Actions/bot exception.
#
# Dependabot currently owns **vcpkg only** (see .github/dependabot.yml).
# GitHub Actions updates are owned by Renovate. The github_actions path below
# is retained as a no-op safety net if Actions were re-enabled by mistake.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  auto-merge:
    name: Auto-merge safe Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Enable auto-merge for actions minor/patch only (dormant while Actions
      # are Renovate-owned). Does not approve; does not force-merge.
      - name: Enable auto-merge for actions minor/patch
        if: |
          steps.meta.outputs.package-ecosystem == 'github_actions' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
