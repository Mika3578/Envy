# Setup steps GitHub Copilot uses when it opens this repo in a remote
# environment. Keep this lightweight and Ubuntu-based so Copilot Code Review
# can use it safely as a fallback while the dedicated review setup is rolling
# out.
name: Copilot setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          submodules: recursive
