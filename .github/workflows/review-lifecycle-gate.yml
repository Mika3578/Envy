# Review Lifecycle Gate
#
# HEAD-bound merge-readiness check for pull requests targeting develop.
# PASS requires Copilot Code Review APPROVED on the current HEAD from
# copilot-pull-request-reviewer (exact login). Other AI reviewers are
# advisory pre-review only.
#
# Trusted evaluation: the live evaluator is loaded from the PR base /
# default branch when present. Unit tests may run from the PR checkout
# without GH_TOKEN. Same-repo bootstrap may load the PR HEAD script only
# until the gate exists on develop; fork PRs never evaluate PR-controlled
# scripts with a token. Do not use pull_request_target.
#
# REVIEW_GATE_ADVISORY=false: PENDING and FAIL both fail the Actions job.

name: Review Lifecycle Gate

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true

concurrency:
  group: review-lifecycle-gate-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Review Lifecycle Gate unit tests
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR for unit tests only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Unit-test decision engine
        run: python3 .github/scripts/review_lifecycle_gate_test.py

  gate:
    name: Review Lifecycle Gate
    needs: unit-test
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Load trusted evaluator and evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REVIEW_GATE_REQUIRE_COPILOT_HEAD_REVIEW: "true"
          REVIEW_GATE_REQUIRE_COPILOT_APPROVAL: "true"
          REVIEW_GATE_REQUIRE_TECHNICAL_CHECKS: "true"
          REVIEW_GATE_ADVISORY: "false"
          REVIEW_GATE_EVENT_ACTION: ${{ github.event.action }}
          REVIEW_GATE_REQUESTED_REVIEWER: ${{ github.event.requested_reviewer.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          load_script() {
            local ref="$1"
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/review_lifecycle_gate.py?ref=$ref" --jq .content | base64 -d > .github/scripts/review_lifecycle_gate.py
          }
          if load_script "$BASE_REF" 2>/dev/null; then
            echo "Loaded evaluator from base ref $BASE_REF"
          elif load_script "$DEFAULT_BRANCH" 2>/dev/null; then
            echo "Loaded evaluator from default branch $DEFAULT_BRANCH"
          elif [[ "$HEAD_REPO" == "$THIS_REPO" && -n "${HEAD_SHA:-}" ]]; then
            echo "::warning::bootstrap: gate script not on $BASE_REF/$DEFAULT_BRANCH; loading same-repo PR HEAD until the gate lands on develop"
            load_script "$HEAD_SHA"
          else
            echo "::error::Trusted gate script missing on $BASE_REF; failing closed for untrusted/fork evaluation"
            exit 1
          fi
          python3 .github/scripts/review_lifecycle_gate.py
