name: Review orchestrator

# Free AI reviewers, one selected per stable Ready head (best available on the
# scoreboard, a second one for high-risk changes), plus one digest
# comment of unresolved threads and an advisory "Review quorum" commit status
# that counts approvals review apps already gave. Never a required check, never
# approves or merges. See docs/10_dev/review-orchestration.md.
#
# pull_request_target runs this file and the script from the base branch and
# never checks out PR code; the digest job also runs the base-branch script.
on:
  pull_request_target:
    types: [opened, ready_for_review, labeled, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  schedule:
    # Scoreboard refresh and escalation of silent reviewers.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (not used by scoreboard)
        required: false
        type: number
      mode:
        description: Action
        required: true
        default: digest
        type: choice
        options: [digest, request, quorum, scoreboard]

permissions:
  contents: read

jobs:
  request:
    name: Request free reviews
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft
        && (github.event.action == 'ready_for_review'
            || github.event.action == 'opened'
            || (github.event.action == 'labeled'
                && github.event.label.name == 'review:request')))
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-request-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Trigger reviewers for this head
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Some review apps ignore commands posted by github-actions[bot]; an
          # optional maintainer token makes the trigger comments count.
          GITHUB_TOKEN: ${{ secrets.REVIEW_TRIGGER_TOKEN || github.token }}
          ENVY_REVIEWERS: ${{ vars.ENVY_REVIEWERS }}
          ENVY_REVIEW_MAX_ROUNDS: ${{ vars.ENVY_REVIEW_MAX_ROUNDS }}
          ENVY_REVIEWERS_PER_HEAD: ${{ vars.ENVY_REVIEWERS_PER_HEAD }}
          ENVY_REVIEWER_LOGINS: ${{ vars.ENVY_REVIEWER_LOGINS }}
          ENVY_REVIEWER_RESET_DAYS: ${{ vars.ENVY_REVIEWER_RESET_DAYS }}
          ENVY_REVIEWER_MONTHLY_CAPS: ${{ vars.ENVY_REVIEWER_MONTHLY_CAPS }}
          ENVY_REVIEW_TIMEOUT_HOURS: ${{ vars.ENVY_REVIEW_TIMEOUT_HOURS }}
        run: python3 .github/scripts/review-orchestrator.py request --pr "$PR"

  digest:
    name: Update review digest
    if: >-
      ((github.event_name == 'pull_request_review'
          || github.event_name == 'pull_request_review_comment'
          || (github.event_name == 'pull_request_target'
              && github.event.action == 'synchronize'))
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'digest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-digest-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Summarize unresolved threads
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/scripts/review-orchestrator.py ]; then
            echo "Orchestrator not on the default branch yet; nothing to do."
            exit 0
          fi
          python3 .github/scripts/review-orchestrator.py digest --pr "$PR"

  quorum:
    name: Review quorum
    # Observation mode: the status is not in the ruleset. It reads reviews and
    # writes one commit status; it never approves, dismisses, or merges.
    if: >-
      ((github.event_name == 'pull_request_review'
          || (github.event_name == 'pull_request_target'
              && github.event.action != 'labeled'))
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'quorum')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: review-quorum-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Count review app approvals on this head
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
          ENVY_QUORUM_VOTERS: ${{ vars.ENVY_QUORUM_VOTERS }}
          ENVY_QUORUM_REQUIRED: ${{ vars.ENVY_QUORUM_REQUIRED }}
        run: |
          if ! grep -q '"quorum"' .github/scripts/review-orchestrator.py; then
            echo "Quorum mode not on the default branch yet; nothing to do."
            exit 0
          fi
          python3 .github/scripts/review-orchestrator.py quorum --pr "$PR"

  scoreboard:
    name: Refresh review scoreboard
    # Recomputes the ranking from recent pull requests, rewrites the scoreboard
    # issue, and escalates a head whose reviewer is limited or silent.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'pull_request_target' && github.event.action == 'closed')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scoreboard')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: review-scoreboard
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Recompute scores and escalate silent reviewers
        env:
          # Escalation posts reviewer commands; the same token keeps them counted.
          GITHUB_TOKEN: ${{ secrets.REVIEW_TRIGGER_TOKEN || github.token }}
          ENVY_REVIEWERS: ${{ vars.ENVY_REVIEWERS }}
          ENVY_REVIEW_MAX_ROUNDS: ${{ vars.ENVY_REVIEW_MAX_ROUNDS }}
          ENVY_REVIEWER_LOGINS: ${{ vars.ENVY_REVIEWER_LOGINS }}
          ENVY_REVIEWER_RESET_DAYS: ${{ vars.ENVY_REVIEWER_RESET_DAYS }}
          ENVY_REVIEWER_MONTHLY_CAPS: ${{ vars.ENVY_REVIEWER_MONTHLY_CAPS }}
          ENVY_REVIEW_TIMEOUT_HOURS: ${{ vars.ENVY_REVIEW_TIMEOUT_HOURS }}
          ENVY_SCOREBOARD_WINDOW_DAYS: ${{ vars.ENVY_SCOREBOARD_WINDOW_DAYS }}
        run: |
          if [ ! -f .github/scripts/review_scoreboard.py ]; then
            echo "Scoreboard not on the default branch yet; nothing to do."
            exit 0
          fi
          python3 .github/scripts/review-orchestrator.py scoreboard
