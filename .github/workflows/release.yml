name: Release

# checkov:skip=CKV_GHA_7:Release tag is operator-supplied for manual publishes.
on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v4.2.0-preview.1)
        required: true
        type: string
      repair_release_id:
        description: Optional existing draft release ID to repair after packaging (never publishes). Empty = dry-run only (no GitHub Release).
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOLUTION: Visual Studio\Envy.sln
  PLATFORM_TOOLSET: v145
  # Prefer workflow_dispatch input; fall back to the pushed tag name.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    name: Build Release ${{ matrix.platform }}
    # windows-2025-vs2026 is the GA hosted image (since 2026-05-04) that
    # ships Visual Studio 2026 (v145 / MSVC 14.50). v145 is the only
    # supported toolset for this branch - a failure here is a real failure.
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    # Hosted runners hit C1083 (PCH permission denied) when Envy.pch is built
    # under parallel CL/MSBuild; serialize the solution build for reliability.
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        with:
          msbuild-architecture: x64

      - name: Verify Visual Studio 2026 with v145 is installed
        shell: pwsh
        run: |
          msbuild -version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere - cannot validate VS install."
            exit 1
          }
          $installVersion = (& $vswhere -latest -prerelease -property installationVersion) -as [string]
          $installPath    = (& $vswhere -latest -prerelease -property installationPath) -as [string]
          Write-Host "Installation : $installPath"
          Write-Host "Version      : $installVersion"

          $msvcDir = Join-Path $installPath "VC\Tools\MSVC"
          if (-not (Test-Path $msvcDir)) {
            Write-Error "VC\Tools\MSVC directory not found in $installPath."
            exit 1
          }
          $vc145 = Get-ChildItem $msvcDir -Directory | Where-Object { $_.Name -match "^14\.5" } | Sort-Object Name -Descending
          if (-not $vc145) {
            Write-Host "Installed MSVC tool directories:"
            Get-ChildItem $msvcDir -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "::error::v145 (MSVC 14.5x) tool directory NOT found in $msvcDir. Expected runner image is windows-2025-vs2026."
            exit 1
          }
          Write-Host "::notice::v145 (MSVC $($vc145[0].Name)) toolset detected at $($vc145[0].FullName)"
          if ($installVersion -notmatch "^18\.") {
            Write-Error "::error::VS major version is $installVersion, expected 18.x (Visual Studio 2026)."
            exit 1
          }

      - name: Verify version sources match tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          ./scripts/release/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Resolve installer channel from tag
        id: channel
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $tag = $env:RELEASE_TAG.ToLowerInvariant()
          $alpha = "False"
          # Align installer channel with Detect prerelease: preview/beta/rc/alpha.
          if ($tag -match "preview|beta|rc") { $alpha = "Preview" }
          elseif ($tag -match "alpha") { $alpha = "True" }
          Write-Host "RELEASE_TAG=$tag -> InstallerAlpha=$alpha"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "InstallerAlpha=$alpha"

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot ".git"))) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }

          $vcpkgManifest = Join-Path $env:GITHUB_WORKSPACE "vcpkg.json"
          $baseline = (Get-Content $vcpkgManifest -Raw | ConvertFrom-Json)."builtin-baseline"
          if ($baseline) {
            git -C $vcpkgRoot checkout $baseline
          }

          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          $resolvedCommit = (git -C $vcpkgRoot rev-parse HEAD).Trim()
          echo "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_COMMIT=$resolvedCommit" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg binary cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-release-${{ runner.os }}-${{ matrix.platform }}-${{ env.PLATFORM_TOOLSET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-release-${{ runner.os }}-${{ matrix.platform }}-${{ env.PLATFORM_TOOLSET }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-release-${{ runner.os }}-${{ matrix.platform }}-${{ env.PLATFORM_TOOLSET }}-

      - name: Install vcpkg dependencies (manifest mode)
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.platform }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet=$triplet

      - name: Build solution
        shell: cmd
        run: |
          msbuild "%SOLUTION%" ^
            %MSBUILD_PARALLEL% ^
            /nologo ^
            /verbosity:minimal ^
            /p:Configuration=Release ^
            /p:Platform=${{ matrix.platform }} ^
            /p:PlatformToolset=%PLATFORM_TOOLSET% ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /p:UseMultiToolTask=%MSBUILD_USE_MULTI_TOOL_TASK% ^
            /p:EnforceProcessCountAcrossBuilds=true ^
            /p:VcpkgEnableManifest=true ^
            /p:VcpkgEnabled=true ^
            /p:VcpkgTriplet=%VCPKG_TARGET_TRIPLET% ^
            /p:InstallerAlpha=${{ steps.channel.outputs.InstallerAlpha }} ^
            /p:TreatWarningsAsErrors=false ^
            /flp:LogFile=release-${{ matrix.platform }}.log;Verbosity=detailed;Encoding=UTF-8 ^
            /flp1:LogFile=release-${{ matrix.platform }}.errors.log;ErrorsOnly;Verbosity=normal

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-build-logs-${{ matrix.platform }}
          path: release-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Stage portable runtime tree
        shell: pwsh
        run: |
          # Mirror Installer/Scripts/Main.iss layout (binaries + Data/Skins/Schemas/...).
          # Do NOT flatten EXE/DLL into a single folder — that is not a portable Envy.
          ./scripts/release/stage-portable.ps1 -Platform ${{ matrix.platform }} -RepoRoot $env:GITHUB_WORKSPACE

      - name: Stage setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/setup | Out-Null
          # Inno Main.iss uses OutputDir=Builds resolved against the MSBuild cwd
          # (repo root). Fail hard if the contract drifts.
          $setupRoot = "Builds"
          if (-not (Test-Path $setupRoot)) {
            Write-Error "Expected Inno Setup output directory not found: $setupRoot"
            exit 1
          }
          $setups = @(Get-ChildItem -Path $setupRoot -Filter *.exe -File)
          if ($setups.Count -ne 1) {
            Write-Error "Expected exactly one setup executable in $setupRoot, found $($setups.Count)."
            $setups | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Copy-Item $setups[0].FullName -Destination artifacts/setup -Force
          Write-Host "Staged setup: $($setups[0].FullName)"

      - name: Verify built Envy.exe version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "artifacts\portable\Envy.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "Envy.exe missing from staged portable artifacts."
            exit 1
          }
          ./scripts/release/verify-version.ps1 -Tag $env:RELEASE_TAG -EnvyExePath $exe

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: envy-${{ matrix.platform }}-release
          path: artifacts/**
          retention-days: 30

  release:
    name: Package release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          path: dist
          pattern: envy-*-release

      - name: Verify version sources match tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          ./scripts/release/verify-version.ps1 -Tag $env:RELEASE_TAG

      - name: Package release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release

          shopt -s nullglob
          for d in dist/envy-*-release; do
            name=$(basename "$d")
            plat="${name#envy-}"
            plat="${plat%-release}"
            case "$plat" in
              x64) slug=x64 ;;
              Win32|win32) slug=win32 ;;
              *) echo "Unknown platform artifact: $name" >&2; exit 1 ;;
            esac

            portable="$d/portable"
            if [[ ! -d "$portable" ]]; then
              echo "Missing portable/ in $d" >&2
              exit 1
            fi
            (cd "$portable" && zip -9 -r "../../../release/Envy-${version}-${slug}.zip" .)

            mapfile -t setups < <(find "$d/setup" -maxdepth 1 -type f -name '*.exe' | sort)
            if [[ ${#setups[@]} -eq 0 ]]; then
              echo "Missing setup .exe in $d/setup" >&2
              exit 1
            fi
            if [[ ${#setups[@]} -gt 1 ]]; then
              echo "Multiple setup executables found; using ${setups[0]}" >&2
            fi
            cp "${setups[0]}" "release/Envy-${version}-${slug}-setup.exe"
          done

          (
            cd release
            sha256sum -- * > SHA256SUMS.txt
          )
          ls -la release

      - name: Verify packaged assets and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          ./scripts/release/verify-artifacts.ps1 -ReleaseDir ./release -Version $version

      - name: Detect prerelease
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          tag="${RELEASE_TAG,,}"
          prerelease=false
          if [[ "$tag" == *preview* || "$tag" == *beta* || "$tag" == *rc* || "$tag" == *alpha* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload packaged release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release/*
          retention-days: 30

      # Tag push: create/reuse draft and upload assets sequentially by release_id.
      # workflow_dispatch: dry-run only UNLESS repair_release_id is explicitly set
      # (repair still keeps draft=true and never publishes).
      - name: Guard accidental manual publish
        if: github.event_name == 'workflow_dispatch' && (inputs.repair_release_id == '' || inputs.repair_release_id == null)
        shell: bash
        run: |
          echo "workflow_dispatch dry-run: skipping GitHub Release (no repair_release_id)."
          echo "Packaged Actions artifact release-${{ env.RELEASE_TAG }} is available for manual inspection."

      - name: Publish or repair draft release
        id: draft
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag') ||
          (github.event_name == 'workflow_dispatch' && inputs.repair_release_id != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REPAIR_RELEASE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_release_id || '' }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          $prerelease = ($env:PRERELEASE -eq 'true')
          $args = @{
            Tag = $env:RELEASE_TAG
            AssetDir = './release'
            Repository = $env:GITHUB_REPOSITORY
            Prerelease = $prerelease
            GenerateNotes = $true
          }
          if ($env:REPAIR_RELEASE_ID) {
            Write-Host "Repair mode: targeting explicit release_id=$($env:REPAIR_RELEASE_ID)"
            $args['ReleaseId'] = $env:REPAIR_RELEASE_ID
            $args['GenerateNotes'] = $false
          }
          ./scripts/release/publish-draft-release.ps1 @args
