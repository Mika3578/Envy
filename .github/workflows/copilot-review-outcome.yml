# Interpret submitted Copilot Code Review outcomes for the PR stabilizer.
# Trusted default-branch script only; never checks out the PR head.
name: Copilot review outcome

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-outcome-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  interpret:
    name: Classify Copilot review
    if: >-
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Classify submitted Copilot review
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_JSON: ${{ toJson(github.event.review) }}
        run: |
          set -euo pipefail
          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"

          # Inline finding titles for this review (untrusted text; parsed as data only).
          if ! [[ "${REVIEW_ID}" =~ ^[0-9]+$ ]]; then
            echo "Invalid REVIEW_ID" >&2
            exit 1
          fi
          export REVIEW_ID
          OPEN_TITLES="$(gh api "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}/comments" \
            --paginate \
            --jq '[.[] | select(.pull_request_review_id == (env.REVIEW_ID | tonumber)) | .body] | map(split("\n")[0])')"

          PRIOR_OUTCOMES="$(gh api "repos/${OWNER}/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '[.[] | select(.body | test("<!-- envy-copilot-review-outcome:v1 -->")) | .body] | map(capture("(?s)<!-- envy-copilot-review-outcome:v1 -->[\\s\\S]*?```json\\n(?<json>[\\s\\S]*?)\\n```") | .json | fromjson)' \
            || echo '[]')"

          printf '%s' "$REVIEW_JSON" | python3 .github/scripts/classify-copilot-review.py \
            --review-json - \
            --open-findings-json "$OPEN_TITLES" \
            --prior-outcomes-json "$PRIOR_OUTCOMES" \
            > outcome.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          outcome = json.loads(Path("outcome.json").read_text(encoding="utf-8"))
          summary = Path.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Copilot review outcome\n\n")
              handle.write(f"- Classification: `{outcome['classification']}`\n")
              handle.write(f"- Assessment: `{outcome['assessment']}`\n")
              handle.write(f"- GitHub review state: `{outcome['github_review_state']}`\n")
              handle.write(f"- Findings: `{outcome['finding_count']}`\n")
              handle.write(f"- Requires fixer: `{outcome['requires_fixer']}`\n")
              handle.write(f"- Requires human: `{outcome['requires_human']}`\n")
              if outcome.get("loop_guard"):
                  handle.write(f"- Loop guard: `{outcome['loop_guard']}`\n")
              handle.write("\n```json\n")
              handle.write(json.dumps(outcome, indent=2))
              handle.write("\n```\n")
          PY

      - name: Publish machine-readable outcome comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          {
            echo "<!-- envy-copilot-review-outcome:v1 -->"
            echo "Copilot review outcome (deterministic classifier; not a merge authority)."
            echo '```json'
            cat outcome.json
            echo '```'
          } >"$BODY_FILE"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body@"$BODY_FILE"
