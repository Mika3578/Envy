name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format check
        run: |
          find . \( -name "*.cpp" -o -name "*.h" \) -print0 | xargs -0 -I{} clang-format --dry-run --Werror {} || true

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet
        run: nuget restore "Visual Studio/Envy.sln"
      - name: Build (Release x64)
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 "Visual Studio/Envy.sln"
      - name: Run tests (if present)
        shell: pwsh
        run: |
          $testExe = "tests\Release x64\EnvyTests.exe"
          if (Test-Path $testExe) { & $testExe } else { Write-Warning "EnvyTests.exe not found" }
