name: Classify changes

on:
  workflow_call:
    outputs:
      cpp:
        value: ${{ jobs.classify.outputs.cpp }}
      build:
        value: ${{ jobs.classify.outputs.build }}
      remote:
        value: ${{ jobs.classify.outputs.remote }}
      csharp:
        value: ${{ jobs.classify.outputs.csharp }}
      dependencies:
        value: ${{ jobs.classify.outputs.dependencies }}
      docs:
        value: ${{ jobs.classify.outputs.docs }}
      workflow:
        value: ${{ jobs.classify.outputs.workflow }}
      docs_only:
        value: ${{ jobs.classify.outputs.docs_only }}
      run_windows_build:
        value: ${{ jobs.classify.outputs.run_windows_build }}
      run_codeql_cpp:
        value: ${{ jobs.classify.outputs.run_codeql_cpp }}
      run_codeql_js:
        value: ${{ jobs.classify.outputs.run_codeql_js }}
      run_codeql_csharp:
        value: ${{ jobs.classify.outputs.run_codeql_csharp }}
      run_remote_js:
        value: ${{ jobs.classify.outputs.run_remote_js }}
      run_format:
        value: ${{ jobs.classify.outputs.run_format }}
      run_dep_review:
        value: ${{ jobs.classify.outputs.run_dep_review }}
      run_docs_check:
        value: ${{ jobs.classify.outputs.run_docs_check }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.run.outputs.cpp }}
      build: ${{ steps.run.outputs.build }}
      remote: ${{ steps.run.outputs.remote }}
      csharp: ${{ steps.run.outputs.csharp }}
      dependencies: ${{ steps.run.outputs.dependencies }}
      docs: ${{ steps.run.outputs.docs }}
      workflow: ${{ steps.run.outputs.workflow }}
      docs_only: ${{ steps.run.outputs.docs_only }}
      run_windows_build: ${{ steps.run.outputs.run_windows_build }}
      run_codeql_cpp: ${{ steps.run.outputs.run_codeql_cpp }}
      run_codeql_js: ${{ steps.run.outputs.run_codeql_js }}
      run_codeql_csharp: ${{ steps.run.outputs.run_codeql_csharp }}
      run_remote_js: ${{ steps.run.outputs.run_remote_js }}
      run_format: ${{ steps.run.outputs.run_format }}
      run_dep_review: ${{ steps.run.outputs.run_dep_review }}
      run_docs_check: ${{ steps.run.outputs.run_docs_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Classify changed paths
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/classify-changes.sh
