name: Code Quality

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly run (default branch only) so the expensive MSVC code-analysis
    # build stays off the PR critical path while still being exercised daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Classify (quality)
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/classify-changes.yml

  static-analysis:
    name: Static Analysis
    runs-on: windows-2025-vs2026
    # Expensive full-solution code-analysis build. Skip it on pull_request -
    # CodeQL already gates PRs; this runs on push to the integration
    # branches, on the nightly schedule, and on demand.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: nuget restore "Visual Studio/Envy.sln"

      - name: Run Code Analysis
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset "Visual Studio/Envy.sln"
        continue-on-error: true

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: code-analysis-results
          path: |
            **/*.nativecodeanalysis.xml
          retention-days: 7

  lint-check:
    name: Format Check
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_format == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: clang-format --dry-run on changed files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' \
            | grep -E '\.(cpp|h|cxx|hpp)$' \
            | grep -E '^(Envy|TorrentEnvy|HashLib)/' \
            | grep -vE '^(Services|Plugins/PluginWizard|Plugins/RatDVDPlugin|Plugins/SWFPlugin)/' \
            || true)
          if [ -z "$files" ]; then
            echo "No relevant C/C++ files changed."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if ! clang-format --dry-run --Werror "$f" 2>&1; then
              fail=1
            fi
          done <<< "$files"
          if [ "$fail" -ne 0 ]; then
            echo "::warning::Formatting differences detected. Run clang-format locally."
          fi
        continue-on-error: true

  documentation-check:
    name: Documentation Check
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_docs_check == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check for README updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' || true)
          if [ -z "$changed" ]; then
            echo "No files changed in this pull request; skipping README advisory."
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Envy|Services|Plugins|HashLib|TorrentEnvy|Remote)/'; then
            if ! echo "$changed" | grep -Fxq 'README.md'; then
              echo "::notice::No README updates in this PR"
            fi
          fi

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
        continue-on-error: true

  remote-js-security-tests:
    name: Remote JS Security Tests
    needs: changes
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && needs.changes.outputs.run_remote_js == 'true') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Remote/tests/package-lock.json

      - name: Install JS test dependencies
        working-directory: Remote/tests
        run: npm ci --no-audit --no-fund

      - name: Run Remote JS tests
        working-directory: Remote/tests
        run: npm test
