name: Code Quality

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly run (default branch only) so the expensive MSVC code-analysis
    # build stays off the PR critical path while still being exercised daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Classify (quality)
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/classify-changes.yml

  static-analysis:
    name: Static Analysis
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    # Expensive full-solution code-analysis build. Skip it on pull_request -
    # CodeQL already gates PRs; this runs on push to the integration
    # branches, on the nightly schedule, and on demand.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Restore NuGet packages
        run: nuget restore "Visual Studio/Envy.sln"

      - name: Run Code Analysis
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset "Visual Studio/Envy.sln"
        continue-on-error: true

      - name: Upload Analysis Results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: code-analysis-results
          path: |
            **/*.nativecodeanalysis.xml
          retention-days: 7

  lint-check:
    name: Format Check
    # Independent of classify-changes: required context must always emit, and a
    # classifier failure must not suppress formatting.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLANG_FORMAT_MAJOR: "18"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Pin to PR head so clang-format-diff hunk line numbers match the tip
          # (default merge ref can shift lines vs base...head hunks).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install clang-format ${{ env.CLANG_FORMAT_MAJOR }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "clang-format-${CLANG_FORMAT_MAJOR}"
          clang-format-${CLANG_FORMAT_MAJOR} --version
          command -v "clang-format-diff-${CLANG_FORMAT_MAJOR}"
          command -v "clang-format-${CLANG_FORMAT_MAJOR}"

      - name: clang-format-diff on changed hunks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLANG_FORMAT_MAJOR: ${{ env.CLANG_FORMAT_MAJOR }}
          CLANG_FORMAT_BIN: clang-format-${{ env.CLANG_FORMAT_MAJOR }}
          CLANG_FORMAT_DIFF: clang-format-diff-${{ env.CLANG_FORMAT_MAJOR }}
        run: |
          set -euo pipefail
          # Prefer Format Check inputs from the PR base so a PR cannot bypass
          # the required check by rewriting format-check.sh or relaxing
          # .clang-format on the branch alone. Hunk content still comes from
          # the HEAD working tree (checkout ref above).
          if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::BASE_SHA is not a valid commit: ${BASE_SHA}"
            exit 1
          fi

          trusted_script="$(mktemp)"
          if git cat-file -e "${BASE_SHA}:.github/scripts/format-check.sh" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/format-check.sh" >"$trusted_script"
            echo "Using format-check.sh from base ${BASE_SHA}"
          else
            # Bootstrap only: script is new on this PR and absent from develop.
            # After merge, the base path above applies and this branch is unused.
            echo "::warning::format-check.sh absent on base ${BASE_SHA}; bootstrap from HEAD ${HEAD_SHA}"
            git show "${HEAD_SHA}:.github/scripts/format-check.sh" >"$trusted_script"
          fi

          if ! git cat-file -e "${BASE_SHA}:.clang-format" 2>/dev/null; then
            echo "::error::.clang-format missing on base ${BASE_SHA}"
            exit 1
          fi
          git show "${BASE_SHA}:.clang-format" >.clang-format
          echo "Pinned .clang-format from base ${BASE_SHA}"
          if git cat-file -e "${BASE_SHA}:.clang-format-ignore" 2>/dev/null; then
            git show "${BASE_SHA}:.clang-format-ignore" >.clang-format-ignore
            echo "Pinned .clang-format-ignore from base ${BASE_SHA}"
          fi

          bash "$trusted_script"

  documentation-check:
    name: Documentation Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_docs_check == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Check for README updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' || true)
          if [ -z "$changed" ]; then
            echo "No files changed in this pull request; skipping README advisory."
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Envy|Services|Plugins|HashLib|TorrentEnvy|Remote)/'; then
            if ! echo "$changed" | grep -Fxq 'README.md'; then
              echo "::notice::No README updates in this PR"
            fi
          fi

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
        continue-on-error: true

  remote-js-security-tests:
    name: Remote JS Security Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'pull_request' && needs.changes.outputs.run_remote_js == 'true') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Remote/tests/package-lock.json

      - name: Install JS test dependencies
        working-directory: Remote/tests
        run: npm ci --no-audit --no-fund

      - name: Run Remote JS tests
        working-directory: Remote/tests
        run: npm test
