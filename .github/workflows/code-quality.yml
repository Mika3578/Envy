name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore NuGet packages
      run: nuget restore "Visual Studio/Envy.sln"
      
    - name: Run Code Analysis
      run: |
        msbuild /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:RunCodeAnalysis=true /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset "Visual Studio/Envy.sln"
      continue-on-error: true
      
    - name: Upload Analysis Results
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: code-analysis-results
        path: |
          **/*.nativecodeanalysis.xml
        retention-days: 7

  lint-check:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
        
    - name: Check formatting (dry-run)
      run: |
        find . -name "*.cpp" -o -name "*.h" | while read file; do
          clang-format --dry-run --Werror "$file" 2>&1 | tee -a format-errors.txt || true
        done
      continue-on-error: true
      
    - name: Show formatting issues
      if: always()
      run: |
        if [ -f format-errors.txt ]; then
          echo "Formatting issues found:"
          cat format-errors.txt
        else
          echo "No formatting issues found"
        fi

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Check for README updates
      run: |
        if ! git diff --name-only origin/main | grep -q "README.md"; then
          echo "::notice::No README updates in this PR"
        fi
        
    - name: Check for broken links in markdown
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
      continue-on-error: true

  dependency-check:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
      continue-on-error: true
