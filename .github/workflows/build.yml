name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build on Windows (x64)
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        msbuild-architecture: x64

    - name: Setup Visual Studio 2026
      uses: microsoft/setup-msbuild@v1.1
      with:
        msbuild-architecture: x64

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
          -DCMAKE_GENERATOR_PLATFORM=x64
      shell: pwsh
      continue-on-error: true

    - name: Build with MSBuild (Visual Studio projects)
      run: |
        msbuild "Visual Studio\Envy.sln" `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=x64 `
          /p:PlatformToolset=v145 `
          /m `
          /v:minimal
      shell: pwsh
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Envy-${{ matrix.configuration }}-x64
        path: |
          **/$(Configuration) $(Platform)/*.exe
          **/$(Configuration) $(Platform)/*.dll
        retention-days: 7
        if-no-files-found: warn

  check-format:
    name: Code Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-15

    - name: Check code formatting
      run: |
        echo "Checking code formatting with clang-format..."
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
          grep -v "^\./Examples/" | \
          grep -v "^\./build/" | \
          grep -v "^\./bin/" | \
          xargs clang-format-15 --dry-run --Werror --style=file
      continue-on-error: true

    - name: Format code (if check fails)
      if: failure()
      run: |
        echo "Formatting issues found. Run: find . -name '*.cpp' -o -name '*.h' | xargs clang-format-15 -i"
        exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CppCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run CppCheck static analysis
      run: |
        echo "Running CppCheck static analysis..."
        cppcheck \
          --enable=all \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress-list=.cppcheck-suppressions \
          --xml --xml-version=2 \
          --output-file=cppcheck-report.xml \
          --inline-suppr \
          --force \
          Envy/ Services/ HashLib/ Plugins/ \
          --exclude=Examples/ \
          2>&1 | tee cppcheck-output.txt || true

    - name: Upload CppCheck report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-report
        path: |
          cppcheck-report.xml
          cppcheck-output.txt
        retention-days: 7

    - name: Check for critical issues
      run: |
        if grep -i "error\|warning" cppcheck-output.txt | grep -v "suppressed"; then
          echo "Found static analysis issues. Review cppcheck-report.xml"
          exit 1
        fi
      continue-on-error: true

    - name: Dependency vulnerability scan
      uses: dependency-review-action@v4
      if: github.event_name == 'pull_request'
      continue-on-error: true

  update-dependencies:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check dependency versions
      run: |
        echo "Checking dependency versions..."
        echo "=== Current Dependencies ==="

        # Check SQLite version
        if [ -f "Services/SQLite/sqlite3.h" ]; then
          SQLITE_VER=$(grep -E "^#define SQLITE_VERSION" Services/SQLite/sqlite3.h | awk '{print $3}' | tr -d '"')
          echo "SQLite: $SQLITE_VER"
        fi

        # Check zlib version
        if [ -f "Services/zlib/zlib.h" ]; then
          ZLIB_VER=$(grep -E "^#define ZLIB_VERSION" Services/zlib/zlib.h | awk '{print $3}' | tr -d '"')
          echo "zlib: $ZLIB_VER"
        fi

        echo ""
        echo "=== Recommended Updates ==="
        echo "SQLite: Update to 3.45.x+ (latest stable)"
        echo "zlib: Update to 1.3.x (latest stable)"
        echo "bzip2: Update to latest version"
        echo "MiniUPnP: Update to latest version"

        echo ""
        echo "See: scripts/update-dependencies.ps1 for update procedures"
      continue-on-error: true

    - name: Generate dependency report
      run: |
        echo "## Dependency Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency | Current | Recommended | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|---------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| SQLite | TBD | 3.45.x+ | 🔄 Pending |" >> $GITHUB_STEP_SUMMARY
        echo "| zlib | TBD | 1.3.x | 🔄 Pending |" >> $GITHUB_STEP_SUMMARY
        echo "| bzip2 | TBD | Latest | 🔄 Pending |" >> $GITHUB_STEP_SUMMARY
        echo "| MiniUPnP | TBD | Latest | 🔄 Pending |" >> $GITHUB_STEP_SUMMARY
