name: Build

# checkov:skip=CKV_GHA_7:Manual reruns need an operator-selected configuration.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      # yamllint disable-line rule:quoted-strings -- ** must be quoted (YAML alias)
      - "**.md"
      - Languages/**
      - Templates/**
      - Skins/**
      - Data/**
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: Visual Studio\Envy.sln
  PLATFORM_TOOLSET: v145

jobs:
  changes:
    name: Classify (build)
    uses: ./.github/workflows/classify-changes.yml

  lint-build-files:
    name: Lint build files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Verify all vcxproj use v145
        shell: bash
        run: |
          bad=$(grep -l "v141_xp\|<PlatformToolset>v14[01234]<" $(find . -name "*.vcxproj" -not -path "./.git/*" -not -path "./Plugins/PluginWizard/*") || true)
          if [ -n "$bad" ]; then
            echo "::error::Projects still using legacy toolset:"
            echo "$bad"
            exit 1
          fi
          echo "All .vcxproj files use v145 or newer."

      - name: Verify Envy.sln is VS 16+ format
        shell: bash
        run: |
          if ! grep -q "Format Version 12.00" "Visual Studio/Envy.sln"; then
            echo "::error::Envy.sln is not Format Version 12.00"
            exit 1
          fi

      - name: Verify no _ATL_XP_TARGETING remains
        shell: bash
        run: |
          # PluginWizard templates are intentionally left untouched.
          bad=$(grep -lr "_ATL_XP_TARGETING" --include="*.vcxproj" --exclude-dir=PluginWizard . || true)
          if [ -n "$bad" ]; then
            echo "::error::_ATL_XP_TARGETING preprocessor macro must be removed from:"
            echo "$bad"
            exit 1
          fi
          echo "_ATL_XP_TARGETING absent from first-party vcxproj files."

      - name: Classify-changes self-test
        shell: bash
        run: bash .github/scripts/classify-changes.selftest.sh

      - name: PR Gate conclusions self-test
        shell: bash
        run: bash .github/scripts/pr-gate-conclusions.selftest.sh

      - name: BugSplat SDK import self-test
        shell: pwsh
        run: pwsh scripts/import-bugsplat-sdk.selftest.ps1

      - name: Format-check self-test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          bash .github/scripts/format-check.selftest.sh

  build-x64-release:
    name: Build x64 Release
    needs: changes
    # Always emit this required context on PRs (even when classify says no
    # Windows build). Skipped required checks block Protect develop.
    # See docs/10_dev/CI_AUDIT_2026-09.md (Documentation Check always-emit).
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Release')
      )
    runs-on: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.run_windows_build == 'true') && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 120
    # Hosted runners hit C1083 (PCH permission denied) when Envy.pch is built
    # under parallel CL/MSBuild; keep /m:1 until a measured A/B on
    # windows-2025-vs2026 proves MTT/CL_MPCount is safe (see CI_AUDIT_2026-09).
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Superseded run (classification cancelled)
        if: needs.changes.result == 'cancelled'
        run: |
          echo "::notice::Classification cancelled (superseded); Build x64 Release no-op success."

      - name: Fail if classification failed
        if: needs.changes.result != 'success' && needs.changes.result != 'cancelled'
        run: |
          echo "::error::Change classification did not succeed (${{ needs.changes.result }})."
          exit 1

      - name: Build not required for this change set
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.run_windows_build != 'true'
        run: |
          echo "::notice::Build x64 Release no-op (classify run_windows_build=false)."

      - name: Checkout
        if: >
          needs.changes.result == 'success' && (
            github.event_name != 'pull_request' ||
            needs.changes.outputs.run_windows_build == 'true'
          )
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Build x64 Release
        if: >
          needs.changes.result == 'success' && (
            github.event_name != 'pull_request' ||
            needs.changes.outputs.run_windows_build == 'true'
          )
        uses: ./.github/actions/windows-msbuild
        with:
          platform: x64
          configuration: Release
          run-tests: "true"
          upload-binaries: ${{ github.event_name != 'pull_request' }}

  build-win32-release:
    name: Build Win32 Release
    needs: changes
    # Always emit this required context on PRs (mirror Build x64 Release).
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Release')
      )
    runs-on: ${{ (github.event_name != 'pull_request' || needs.changes.outputs.run_windows_build == 'true') && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Superseded run (classification cancelled)
        if: needs.changes.result == 'cancelled'
        run: |
          echo "::notice::Classification cancelled (superseded); Build Win32 Release no-op success."

      - name: Fail if classification failed
        if: needs.changes.result != 'success' && needs.changes.result != 'cancelled'
        run: |
          echo "::error::Change classification did not succeed (${{ needs.changes.result }})."
          exit 1

      - name: Build not required for this change set
        if: github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.run_windows_build != 'true'
        run: |
          echo "::notice::Build Win32 Release no-op (classify run_windows_build=false)."

      - name: Checkout
        if: >
          needs.changes.result == 'success' && (
            github.event_name != 'pull_request' ||
            needs.changes.outputs.run_windows_build == 'true'
          )
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Build Win32 Release
        if: >
          needs.changes.result == 'success' && (
            github.event_name != 'pull_request' ||
            needs.changes.outputs.run_windows_build == 'true'
          )
        uses: ./.github/actions/windows-msbuild
        with:
          platform: Win32
          configuration: Release
          run-tests: "true"
          upload-binaries: ${{ github.event_name != 'pull_request' }}

  build-debug:
    name: Build ${{ matrix.platform }} Debug
    needs: changes
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Debug')
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Build ${{ matrix.platform }} Debug
        uses: ./.github/actions/windows-msbuild
        with:
          platform: ${{ matrix.platform }}
          configuration: Debug
          run-tests: "true"
          upload-binaries: "false"
