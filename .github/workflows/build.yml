name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, Win32]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        msbuild-architecture: x64
        vs-version: 17

    - name: Configure CMake
      run: |
        cmake -B build -S . `
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
          -DCMAKE_GENERATOR_PLATFORM=${{ matrix.platform }}
      shell: pwsh
      continue-on-error: true

    - name: Build with MSBuild (Visual Studio projects)
      run: |
        msbuild "Visual Studio\Envy.sln" `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:PlatformToolset=v145 `
          /m `
          /v:minimal
      shell: pwsh
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Envy-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/$(Configuration) $(Platform)/*.exe
          **/$(Configuration) $(Platform)/*.dll
        retention-days: 7
        if-no-files-found: warn

  check-format:
    name: Code Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-15

    - name: Check code formatting
      run: |
        echo "Checking code formatting with clang-format..."
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
          grep -v "^\./Examples/" | \
          grep -v "^\./build/" | \
          grep -v "^\./bin/" | \
          xargs clang-format-15 --dry-run --Werror --style=file
      continue-on-error: true

    - name: Format code (if check fails)
      if: failure()
      run: |
        echo "Formatting issues found. Run: find . -name '*.cpp' -o -name '*.h' | xargs clang-format-15 -i"
        exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CppCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run CppCheck static analysis
      run: |
        echo "Running CppCheck static analysis..."
        cppcheck \
          --enable=all \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --suppress-list=.cppcheck-suppressions \
          --xml --xml-version=2 \
          --output-file=cppcheck-report.xml \
          --inline-suppr \
          --force \
          Envy/ Services/ HashLib/ Plugins/ \
          --exclude=Examples/ \
          2>&1 | tee cppcheck-output.txt || true

    - name: Upload CppCheck report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-report
        path: |
          cppcheck-report.xml
          cppcheck-output.txt
        retention-days: 7

    - name: Check for critical issues
      run: |
        if grep -i "error\|warning" cppcheck-output.txt | grep -v "suppressed"; then
          echo "Found static analysis issues. Review cppcheck-report.xml"
          exit 1
        fi
      continue-on-error: true

    - name: Dependency vulnerability scan
      uses: dependency-review-action@v4
      if: github.event_name == 'pull_request'
      continue-on-error: true

  update-dependencies:
    name: Dependency Updates
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check dependency versions
      run: |
        echo "Checking dependency versions..."
        echo "=== Current Dependencies ==="

        # Check SQLite version
        SQLITE_VER="Unknown"
        if [ -f "Services/SQLite/sqlite3.h" ]; then
          SQLITE_VER=$(grep -E "^#define SQLITE_VERSION" Services/SQLite/sqlite3.h | awk '{print $3}' | tr -d '"' || echo "Unknown")
        fi

        # Check zlib version
        ZLIB_VER="Unknown"
        if [ -f "Services/zlib/zlib.h" ]; then
          ZLIB_VER=$(grep -E "^#define ZLIB_VERSION" Services/zlib/zlib.h | awk '{print $3}' | tr -d '"' || echo "Unknown")
        fi

        echo "SQLite: $SQLITE_VER"
        echo "zlib: $ZLIB_VER"

        echo ""
        echo "=== Version Status ==="
        if [ "$SQLITE_VER" = "3.51.1" ]; then
          echo "✅ SQLite: $SQLITE_VER (UP TO DATE)"
        else
          echo "⚠️ SQLite: $SQLITE_VER (Update to 3.51.1 recommended)"
        fi

        if [ "$ZLIB_VER" = "1.3" ]; then
          echo "✅ zlib: $ZLIB_VER (UP TO DATE)"
        else
          echo "⚠️ zlib: $ZLIB_VER (Update to 1.3 recommended)"
        fi

        echo ""
        echo "=== Other Dependencies ==="
        echo "bzip2: Check version and update if needed"
        echo "MiniUPnP: Check version and update if needed"

        echo ""
        echo "See: dev-docs/DEPENDENCY_STATUS.md for details"
      continue-on-error: true

    - name: Generate dependency report
      run: |
        SQLITE_VER="Unknown"
        ZLIB_VER="Unknown"

        if [ -f "Services/SQLite/sqlite3.h" ]; then
          SQLITE_VER=$(grep -E "^#define SQLITE_VERSION" Services/SQLite/sqlite3.h | awk '{print $3}' | tr -d '"' || echo "Unknown")
        fi

        if [ -f "Services/zlib/zlib.h" ]; then
          ZLIB_VER=$(grep -E "^#define ZLIB_VERSION" Services/zlib/zlib.h | awk '{print $3}' | tr -d '"' || echo "Unknown")
        fi

        echo "## Dependency Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency | Current | Recommended | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|---------|-------------|--------|" >> $GITHUB_STEP_SUMMARY

        if [ "$SQLITE_VER" != "Unknown" ]; then
          if [ "$SQLITE_VER" = "3.51.1" ]; then
            echo "| SQLite | $SQLITE_VER | 3.51.1 | ✅ Up to date |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| SQLite | $SQLITE_VER | 3.51.1 | ⚠️ Outdated |" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "| SQLite | Unknown | 3.51.1 | ⏳ Needs check |" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "$ZLIB_VER" != "Unknown" ]; then
          if [ "$ZLIB_VER" = "1.3" ]; then
            echo "| zlib | $ZLIB_VER | 1.3 | ✅ Up to date |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| zlib | $ZLIB_VER | 1.3 | ⚠️ Outdated |" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "| zlib | Unknown | 1.3 | ⏳ Needs check |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "| bzip2 | Unknown | Latest | ⏳ Needs check |" >> $GITHUB_STEP_SUMMARY
        echo "| MiniUPnP | Unknown | Latest | ⏳ Needs check |" >> $GITHUB_STEP_SUMMARY
