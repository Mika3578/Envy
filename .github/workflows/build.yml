name: Full CI

# checkov:skip=CKV_GHA_7:Manual reruns need an operator-selected configuration.
on:
  push:
    branches: [main, develop]
    tags: [v*]
    paths-ignore:
      - "**.md"
      - "Languages/**"
      - "Templates/**"
      - "Skins/**"
      - "Data/**"
  schedule:
    - cron: 17 3 * * 0
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  SOLUTION: Visual Studio\Envy.sln
  PLATFORM_TOOLSET: v145
  VCPKG_INSTALLATION_ROOT: ${{ runner.temp }}\vcpkg
  VCPKG_INSTALLED_DIR: ${{ runner.temp }}\vcpkg_installed
  VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg_cache,readwrite

jobs:
  build:
    name: Full CI ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        configuration: [Release, Debug]
        include:
          - platform: x64
            msbuild_platform: x64
            triplet: x64-windows-static
          - platform: Win32
            msbuild_platform: Win32
            triplet: x86-windows-static
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Verify Visual Studio 2026 with v145 is installed
        shell: pwsh
        run: |
          msbuild -version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere - cannot validate VS install."
            exit 1
          }
          $installVersion = (& $vswhere -latest -prerelease -property installationVersion) -as [string]
          $installPath = (& $vswhere -latest -prerelease -property installationPath) -as [string]
          Write-Host "Installation : $installPath"
          Write-Host "Version      : $installVersion"
          $msvcDir = Join-Path $installPath "VC\Tools\MSVC"
          if (-not (Test-Path $msvcDir)) {
            Write-Error "VC\Tools\MSVC directory not found in $installPath."
            exit 1
          }
          $vc145 = Get-ChildItem $msvcDir -Directory | Where-Object { $_.Name -match "^14\.5" } | Sort-Object Name -Descending
          if (-not $vc145) {
            Get-ChildItem $msvcDir -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "::error::v145 (MSVC 14.5x) tool directory NOT found in $msvcDir."
            exit 1
          }
          Write-Host "::notice::v145 (MSVC $($vc145[0].Name)) toolset detected at $($vc145[0].FullName)"
          if ($installVersion -notmatch "^18\.") {
            Write-Error "::error::VS major version is $installVersion, expected 18.x (Visual Studio 2026)."
            exit 1
          }

      - name: Cache vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\vcpkg_cache
          key: vcpkg-full-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-full-${{ runner.os }}-${{ matrix.platform }}-

      - name: Bootstrap vcpkg outside workspace
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not (Test-Path (Join-Path $vcpkgRoot '.git'))) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-configuration.json'
          if (Test-Path $configPath) {
            $baseline = (Get-Content $configPath -Raw | ConvertFrom-Json).'builtin-baseline'
            if ($baseline) { git -C $vcpkgRoot checkout $baseline }
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install vcpkg dependencies (manifest mode)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet=$env:VCPKG_TARGET_TRIPLET `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:VCPKG_INSTALLED_DIR"

      - name: Restore NuGet packages (if any)
        shell: pwsh
        run: |
          if (Test-Path "Visual Studio\Envy.sln") {
            nuget restore "Visual Studio\Envy.sln" -NonInteractive 2>$null
          }
        continue-on-error: true

      - name: Build solution
        shell: cmd
        run: |
          msbuild "%SOLUTION%" ^
            %MSBUILD_PARALLEL% ^
            /nologo ^
            /verbosity:minimal ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.msbuild_platform }} ^
            /p:PlatformToolset=%PLATFORM_TOOLSET% ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /p:UseMultiToolTask=%MSBUILD_USE_MULTI_TOOL_TASK% ^
            /p:EnforceProcessCountAcrossBuilds=true ^
            /p:VcpkgEnableManifest=true ^
            /p:VcpkgEnabled=true ^
            /p:VcpkgTriplet=%VCPKG_TARGET_TRIPLET% ^
            /p:VcpkgInstalledDir=%VCPKG_INSTALLED_DIR%\%VCPKG_TARGET_TRIPLET% ^
            /p:TreatWarningsAsErrors=false ^
            /flp:LogFile=full-ci-${{ matrix.platform }}-${{ matrix.configuration }}.log;Verbosity=detailed;Encoding=UTF-8 ^
            /flp1:LogFile=full-ci-${{ matrix.platform }}-${{ matrix.configuration }}.warnings.log;WarningsOnly;Verbosity=normal ^
            /flp2:LogFile=full-ci-${{ matrix.platform }}-${{ matrix.configuration }}.errors.log;ErrorsOnly;Verbosity=normal

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-ci-logs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: full-ci-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload binaries
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: envy-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            Envy/**/Release/*.exe
            Envy/**/Release/*.dll
            Plugins/**/Release/*.dll
            Builds/**
          if-no-files-found: warn
          retention-days: 14

  lint-build-files:
    name: Lint build files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify all vcxproj use v145
        shell: bash
        run: |
          bad=$(grep -l "v141_xp\|<PlatformToolset>v14[01234]<" $(find . -name "*.vcxproj" -not -path "./.git/*" -not -path "./Plugins/PluginWizard/*") || true)
          if [ -n "$bad" ]; then
            echo "::error::Projects still using legacy toolset:"
            echo "$bad"
            exit 1
          fi
          echo "All .vcxproj files use v145 or newer."

      - name: Verify Envy.sln is VS 16+ format
        shell: bash
        run: |
          if ! grep -q "Format Version 12.00" "Visual Studio/Envy.sln"; then
            echo "::error::Envy.sln is not Format Version 12.00"
            exit 1
          fi

      - name: Verify no _ATL_XP_TARGETING remains
        shell: bash
        run: |
          bad=$(grep -lr "_ATL_XP_TARGETING" --include="*.vcxproj" --exclude-dir=PluginWizard . || true)
          if [ -n "$bad" ]; then
            echo "::error::_ATL_XP_TARGETING preprocessor macro must be removed from:"
            echo "$bad"
            exit 1
          fi
          echo "_ATL_XP_TARGETING absent from first-party vcxproj files."
