version: 2
updates:
  # Native C/C++ dependencies via vcpkg manifest.
  # Dependabot advances vcpkg-configuration.json's builtin-baseline commit hash
  # rather than bumping individual packages - keeps the curated set consistent.
  #
  # GitHub Actions updates are owned by Renovate (renovate.json) to enable
  # grouping, digests, and a Dependency Dashboard without duplicate PRs.
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "vcpkg"
    commit-message:
      prefix: "deps(vcpkg)"
      include: "scope"
    groups:
      vcpkg-baseline:
        patterns:
          - "*"
