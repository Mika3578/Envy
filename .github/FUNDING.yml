# Funding

If you find Envy useful, please consider supporting its development.

## Ways to Support

### Code Contributions
The best way to support Envy is through code contributions. See [CONTRIBUTING.md](../CONTRIBUTING.md) for guidelines.

### Bug Reports & Testing
Help improve stability by reporting bugs and testing new releases.

### Documentation
Help improve documentation, translations, and user guides.

### Spread the Word
Share Envy with others who might find it useful.

---

*Envy is an open-source project maintained by volunteers.*
