# Repository settings configuration
# Usable with Probot Settings. Live merge gate for `develop` is the GitHub
# repository ruleset **Protect develop** (Settings → Rules). When Probot and
# the ruleset disagree, the **ruleset wins**.

repository:
  # Repository information
  name: Envy
  description: "Multi-Network P2P Filesharing and BitTorrent Client for Windows"
  homepage: http://getenvy.com
  topics:
    - p2p
    - bittorrent
    - file-sharing
    - gnutella
    - ed2k
    - cpp
    - cpp20
    - windows
    - mfc
    - peer-to-peer

  # Repository settings
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  default_branch: develop
  allow_squash_merge: true
  allow_merge_commit: false
  # Global repo default. Protect develop still enforces squash-only via ruleset.
  # Live GitHub squash defaults (verify in Settings → General → Pull Requests):
  #   squash_merge_commit_title: PR_TITLE
  #   squash_merge_commit_message: BLANK  (no auto PR-body dump; maintainer
  #   still supplies a concise squash body at merge — see AGENTS.md rule 16)
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Labels for issues and pull requests.
# Mirrors the live repository label inventory (verified 2026-11-26 via the
# Labels API) so a Probot Settings apply is a no-op instead of introducing
