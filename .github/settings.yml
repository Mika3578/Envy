# Classic branch-protection template (Probot Settings).
# Live enforcement is the repository ruleset **Protect develop**.
#
# Probot Settings does NOT model these ruleset-only options — set them on the
# GitHub ruleset (UI or Rulesets API), not as invented YAML keys here:
#   - required_review_thread_resolution: true
#   - require_last_push_approval: false  (intentional; dismiss-stale is on)
#   - dismiss_stale_reviews_on_push: true
#   - allowed_merge_methods: ["squash"] only (develop ruleset)
#   - required_signatures: false on develop (live Protect develop)
#   - bypass_actors: [] (none)
#   - non_fast_forward / block force pushes
#   - code_scanning: CodeQL + Gitleaks
#   - GitHub Code Quality severity (live: All)
#   - Copilot review-on-push (live: off) / draft review (live: off)
#   - Copilot approve/count UI toggles + path allowlist excluding privileged
#     governance paths (do not leave blank; manual verify in Settings → Copilot)
#   - code coverage rule (intentionally off until reliable PR coverage upload exists)
branches:
  - name: develop
    protection:
      required_linear_history: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        # Exact contexts required by the live Protect develop ruleset.
        contexts:
          - "Build x64 Release"
          - "Build Win32 Release"
          - "Lint build files"
          - "Vcpkg manifest sanity"
          - "Format Check"
          - "secret-scan"
          - "Analyze (c-cpp)"
          - "SonarCloud Code Analysis"
      enforce_admins: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
