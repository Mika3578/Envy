# Gemini Code Assist on GitHub (free consumer tier: 33 reviews per day).
# Reviews are advisory. The review orchestrator posts `/gemini review` once
# per stable Ready head, so automatic reviews on open stay off.
have_fun: false
ignore_patterns:
  - "Services/**"
  - "Plugins/PluginWizard/**"
  - "Plugins/RatDVDPlugin/**"
  - "Plugins/SWFPlugin/**"
  - "HashLib/HashLib/**"
  - "Languages/**/*.xml"
  - "**/*.png"
  - "**/*.ico"
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: 15
  pull_request_opened:
    help: false
    summary: false
    code_review: false
    include_drafts: false
