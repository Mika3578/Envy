# SonarCloud Automatic Analysis configuration for Envy.
# Exclude vendored / third-party trees (AGENTS.md §2 rule 4) from analysis and
# CPD so New Code duplication is not dominated by SQLite/zlib/BugTrap clones.
# Do not weaken the Quality Gate thresholds to pass.

sonar.exclusions=\
Services/zlib/**,\
Services/SQLite/**,\
Services/Bzlib/**,\
Services/UnRAR/**,\
Services/MiniUPnP/**,\
Services/GeoIP/**,\
Services/LibUTP/**,\
Services/BugTrap/**,\
Plugins/RatDVDPlugin/**,\
Plugins/SWFPlugin/**,\
Plugins/PluginWizard/**,\
HashLib/HashLib/**

sonar.cpd.exclusions=\
Services/zlib/**,\
Services/SQLite/**,\
Services/Bzlib/**,\
Services/UnRAR/**,\
Services/MiniUPnP/**,\
Services/GeoIP/**,\
Services/LibUTP/**,\
Services/BugTrap/**,\
Plugins/RatDVDPlugin/**,\
Plugins/SWFPlugin/**,\
Plugins/PluginWizard/**,\
Plugins/FictionBookReader/**,\
Plugins/NETInterop/FictionBookReader/**,\
HashLib/HashLib/**
