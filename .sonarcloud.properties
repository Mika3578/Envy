# SonarCloud Automatic Analysis configuration for Envy.
# Exclude vendored / third-party trees (AGENTS.md §2 rule 4) from analysis and
# CPD so New Code duplication is not dominated by SQLite/zlib/BugTrap clones.
# Do not weaken the Quality Gate thresholds to pass.
#
# projectVersion must track the product FILEVERSION/ProductVersion (Envy.rc).
# New Code on develop uses previous_version; without a version marker SonarCloud
# treated the modernization window (since 2026-05) as New Code (~200k+ lines).
# Publishing this marker creates a VERSION analysis event; a subsequent bump
# (see docs/10_dev/sonarcloud-exclusions.md) resets New Code to post-marker
# changes only. Do not invent a fake version solely to silence the gate.

sonar.projectVersion=4.2.0

# Marker published for Automatic Analysis VERSION event on develop (#234/#246).

sonar.exclusions=\
Services/zlib/**,\
Services/SQLite/**,\
Services/Bzlib/**,\
Services/UnRAR/**,\
Services/MiniUPnP/**,\
Services/GeoIP/**,\
Services/LibUTP/**,\
Services/BugTrap/**,\
Plugins/RatDVDPlugin/**,\
Plugins/SWFPlugin/**,\
Plugins/PluginWizard/**,\
HashLib/HashLib/**

sonar.cpd.exclusions=\
Services/zlib/**,\
Services/SQLite/**,\
Services/Bzlib/**,\
Services/UnRAR/**,\
Services/MiniUPnP/**,\
Services/GeoIP/**,\
Services/LibUTP/**,\
Services/BugTrap/**,\
Plugins/RatDVDPlugin/**,\
Plugins/SWFPlugin/**,\
Plugins/PluginWizard/**,\
Plugins/FictionBookReader/**,\
Plugins/NETInterop/FictionBookReader/**,\
HashLib/HashLib/**
